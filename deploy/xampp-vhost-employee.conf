# CE-Group 社員専用 — ローカル開発用 VirtualHost
# setup-employee-local-host.cmd 実行後、Apache を再起動してください。
#
# hosts:
#   127.0.0.1    employee.local
#
# アクセス URL:
#   http://employee.local/login
#
# WordPress は本番のみ（https://employee.careearth.net/wordpress/）
# 経理・人事フォーム: public/finance-hr → apps/finance-hr（ジャンクション）
# 入口: http://employee.local/apps/finance-hr

<VirtualHost *:80>
    ServerName employee.local
    DocumentRoot "C:/xampp/htdocs/employee/public"

    <Directory "C:/xampp/htdocs/employee/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/employee.local-error.log"
    CustomLog "logs/employee.local-access.log" common
</VirtualHost>
